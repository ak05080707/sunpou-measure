<!doctype html>

<body>
<title>写真で寸法を測る</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1c1f23;--sub:#6b7280;--line:#d9dde3;--main:#2563eb}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--card:#1d2025;--text:#eceef1;--sub:#9aa3af;--line:#343942;color-scheme:dark}}
  :root[data-theme="dark"]{--bg:#111316;--card:#1d2025;--text:#eceef1;--sub:#9aa3af;--line:#343942;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;
       padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
       max-width:980px;margin-inline:auto;-webkit-user-select:none;user-select:none}
  h1{font-size:18px;margin:4px 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
  button:disabled{opacity:.4}
  .main{background:var(--main)!important;color:#fff!important;border-color:var(--main)!important}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row+.row{margin-top:10px}
  .seg button{flex:1}
  .seg button.on{background:var(--main);color:#fff;border-color:var(--main)}
  .chip.on{background:var(--main);color:#fff;border-color:var(--main)}
  .tab{border-left-width:8px}
  .tab.on{font-weight:700;outline:2px solid var(--main)}
  input[type=number]{font:inherit;width:96px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);min-height:44px}
  input[type=range]{flex:1;min-width:120px}
  #wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;touch-action:none}
  .ein{position:absolute;width:84px;min-height:0;transform:translate(-50%,-50%);padding:5px 6px;font:700 15px -apple-system,sans-serif;text-align:center;border-radius:8px;border:2px solid var(--main);background:var(--card);color:var(--text);z-index:2;-webkit-user-select:text;user-select:text}
  canvas{display:block;width:100%;touch-action:none}
  #hint{color:var(--sub);font-size:14px;margin:8px 0 0}
  ul{list-style:none;margin:6px 0 0;padding:0}
  li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  li small{color:var(--sub)}
  .big{font-weight:700}
  .pname{font-weight:700;margin-top:10px;display:flex;align-items:center;gap:6px}
  .sw{width:14px;height:14px;border-radius:4px;display:inline-block}
  #file{display:none}
  .small{color:var(--sub);font-size:13px}
  #liveBar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:column;gap:8px;
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    background:rgba(0,0,0,.85);color:#fff}
  #liveBar .row{justify-content:center;flex-wrap:nowrap;margin:0!important}
  #liveBar button{background:#2b2f36;color:#fff;border-color:#474d57}
  #liveBar button.on{background:var(--main);border-color:var(--main)}
  #liveBar input[type=number]{width:86px;background:#2b2f36;color:#fff;border-color:#474d57}
  #bShoot{width:76px;height:76px;min-height:76px;border-radius:50%;background:#fff!important;border:6px solid #9aa3af!important;padding:0}
  body.live{overflow:hidden;background:#000}
  body.live .wk,body.live #topCard,body.live #listCard,body.live .note,body.live h1{display:none!important}
  body.live #work{border:0;padding:0;background:none;margin:0}
  #wrap.live{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);border-radius:0;margin:0!important;z-index:10}
  #camMsg{color:#dc2626;font-size:14px;margin:8px 0 0}
</style>
<h1>📐 写真で寸法を測る</h1>

<div class="card" id="topCard">
  <div class="row">
    <label class="btn main" for="file">📷 写真を撮る／選ぶ</label>
    <input id="file" type="file" accept="image/*">
    <button id="bCam">🎥 カメラで撮る（重ね表示）</button>
  </div>
  <div id="camMsg"></div>
  <div class="row" style="display:none">
  </div>
</div>

<div class="card" id="work" style="display:none">
  <div class="row" id="tabs"></div>

  <div class="row" id="sizeRow1">
    <span>基準の四角</span>
    <button class="chip" data-s="100">100</button>
    <button class="chip" data-s="300">300</button>
    <button class="chip" data-s="500">500</button>
    <button class="chip" data-s="1000">1000</button>
    <span class="small">mm</span>
  </div>
  <div class="row" id="sizeRow2">
    <span>横</span><input id="sw" type="number" inputmode="decimal">
    <span>縦</span><input id="sh" type="number" inputmode="decimal">
    <span class="small">mm</span>
  </div>
  <div class="row">
    <span>四角の濃さ</span>
    <input id="alpha" type="range" min="10" max="90" value="50">
    <span id="alphaV">50%</span>
  </div>

  <div class="row seg">
    <button id="bQuad" class="on">① 合わせる</button>
    <button id="bMea">② 測る</button>
    <button id="bDiag" style="display:none">③ 3D斜め</button>
  </div>

  <div id="wrap" style="margin-top:10px"><canvas id="cv"></canvas>
    <input id="ew" class="ein" type="number" inputmode="decimal" aria-label="上の線の長さ（mm）">
    <input id="eh" class="ein" type="number" inputmode="decimal" aria-label="左の線の長さ（mm）">
  </div>
  <p id="hint"></p>
  <div class="row">
    <button id="bUndo">1つ戻す</button>
    <button id="bClear">測定を全部消す</button>
  </div>
</div>

<div class="card" id="listCard" style="display:none">
  <b>測った結果</b>
  <div id="list"></div>
</div>

<p class="small">
  ※ 面（壁など）ごとに「四角」を合わせます。四角と測る場所は、同じ平らな面の上にしてください。
  奥行きは、横の壁など別の面に「＋面を追加」して測ります。「＋立方体」を使うと、箱の3つの面（上・左・右）を一度に合わせられます。
</p>

<div id="liveBar">
  <div class="row">
    <button id="lSq" class="on">四角</button><button id="lCube">立方体</button>
    <span id="lszBox"><span>1辺</span> <input id="lsz" type="number" inputmode="decimal"> <span>mm</span></span>
  </div>
  <div class="row">
    <span>濃さ</span><input id="lalpha" type="range" min="10" max="90" value="50" style="max-width:220px"><span id="lalphaV">50%</span>
  </div>
  <div class="row" style="justify-content:space-between">
    <button id="bStop">やめる</button><button id="bShoot" aria-label="撮影"></button><span style="min-width:76px"></span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const COLORS = ['#f59e0b','#10b981','#a855f7','#ef4444','#0ea5e9','#ec4899','#14b8a6','#84cc16'];
const R_HIT = 34;

let img = null, nw = 1, nh = 1, cssW = 0, cssH = 0, dpr = 1;
let live = false, stream = null, vid = null;
let planes = [], act = 0, mode = 'quad', alpha = .5, drag = null, groupSeq = 0, diags = [];

/* ---------- 射影変換（斜めのゆがみを直す計算） ---------- */
function homography(src, dst){
  const A = [], b = [];
  for(let i=0;i<4;i++){
    const {x,y} = src[i], X = dst[i].x, Y = dst[i].y;
    A.push([x,y,1,0,0,0,-x*X,-y*X]); b.push(X);
    A.push([0,0,0,x,y,1,-x*Y,-y*Y]); b.push(Y);
  }
  const n = 8;
  for(let c=0;c<n;c++){
    let p = c;
    for(let r=c+1;r<n;r++) if(Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if(Math.abs(A[p][c]) < 1e-12) return null;
    [A[c],A[p]] = [A[p],A[c]]; [b[c],b[p]] = [b[p],b[c]];
    for(let r=0;r<n;r++){
      if(r===c) continue;
      const f = A[r][c]/A[c][c]; if(!f) continue;
      for(let k=c;k<n;k++) A[r][k] -= f*A[c][k];
      b[r] -= f*b[c];
    }
  }
  return b.map((v,i) => v/A[i][i]);
}
function ap(h,x,y){
  const w = h[6]*x + h[7]*y + 1;
  return {x:(h[0]*x+h[1]*y+h[2])/w, y:(h[3]*x+h[4]*y+h[5])/w};
}
// 画像上の点(0〜1) → 面の上の位置(mm)
function toPlane(pl,p){
  const q = ap(pl.h, p.x, p.y*nh/nw);
  return {x:q.x*pl.w, y:q.y*pl.h_mm};
}
// 面の上(0〜1の比率) → 画像上の点(0〜1)
function fromUnit(pl,u,v){
  const q = ap(pl.hi, u, v);
  return {x:q.x, y:q.y*nw/nh};
}
function recalc(pl){
  const s = pl.quad.map(p => ({x:p.x, y:p.y*nh/nw}));
  const u = [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];
  pl.h = homography(s,u);
  pl.hi = homography(u,s);
  // 四角が正しく並んでいるか（ねじれ・つぶれの確認）
  const q = pl.quad.map(p => ({x:p.x*nw, y:p.y*nh}));
  let sign = 0, ok = !!(pl.h && pl.hi);
  for(let i=0;i<4 && ok;i++){
    const a = q[i], b = q[(i+1)%4], c = q[(i+2)%4];
    const cr = (b.x-a.x)*(c.y-b.y) - (b.y-a.y)*(c.x-b.x);
    if(Math.abs(cr) < 1) ok = false;
    else if(!sign) sign = Math.sign(cr);
    else if(Math.sign(cr) !== sign) ok = false;
  }
  pl.ok = ok;
}

function newPlane(i){
  const side = .45*Math.min(nw,nh), hx = side/2/nw, hy = side/2/nh, o = i*.04;
  const pl = {w:1000, h_mm:1000, items:[],
    quad:[{x:.5-hx+o,y:.5-hy+o},{x:.5+hx+o,y:.5-hy+o},{x:.5+hx+o,y:.5+hy+o},{x:.5-hx+o,y:.5+hy+o}]};
  recalc(pl); return pl;
}
// 立方体（サイコロ）：見える3面（上・左・右）が、角の点を共有する
function newCube(){
  const S = 1000, g = ++groupSeq; // 立方体の1辺は 1000 mm で固定
  const r = .27*Math.min(nw,nh), o = planes.length*.02, c = .8660254;
  const P = (dx,dy) => ({x:Math.min(.98,Math.max(.02,.5+dx*r/nw+o)), y:Math.min(.98,Math.max(.02,.5+dy*r/nh+o))});
  const p0 = P(0,0), p1 = P(-c,-.5), p2 = P(0,-1), p3 = P(c,-.5), p4 = P(-c,.5), p5 = P(0,1), p6 = P(c,.5);
  const mk = (name,quad,role) => ({w:S,h_mm:S,items:[],quad,name:'立方体'+g+'・'+name,group:g,role});
  const cube = [mk('上面',[p1,p2,p3,p0],'top'), mk('左面',[p1,p0,p5,p4],'left'), mk('右面',[p0,p3,p6,p5],'right')];
  cube.forEach(recalc); return cube;
}
// 立方体の角(near-top)を原点に、3つの辺を軸A・B・Cとした空間の位置(mm)
function to3D(pl,p){
  const m = toPlane(pl,p), S = pl.w;
  if(pl.role === 'top') return [m.x, S-m.y, 0];
  if(pl.role === 'left') return [0, S-m.x, m.y];
  return [m.x, 0, m.y];
}
function len3(d){
  const a = to3D(d.pts[0].f,d.pts[0]), b = to3D(d.pts[1].f,d.pts[1]);
  return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
}
function setSize(pl,wv,hv){
  if(pl.group) planes.filter(p => p.group === pl.group).forEach(p => { p.w = p.h_mm = (wv != null ? wv : hv); });
  else { if(wv != null) pl.w = wv; if(hv != null) pl.h_mm = hv; }
}

function fmt(mm){
  if(mm == null || isNaN(mm)) return '—';
  return mm >= 1000 ? (mm/1000).toFixed(3).replace(/\.?0+$/,'') + ' m' : (Math.round(mm*10)/10) + ' mm';
}
function measure(pl,a,b){
  const A = toPlane(pl,a), B = toPlane(pl,b);
  const dx = Math.abs(A.x-B.x), dy = Math.abs(A.y-B.y);
  return {len:Math.hypot(dx,dy), dx, dy};
}

/* ---------- 描画 ---------- */
function layout(){
  if(!img) return;
  const wr = $('wrap');
  if(live){
    const barH = $('liveBar').offsetHeight || 190;
    const availH = window.innerHeight - barH - 8, availW = window.innerWidth;
    wr.style.width = Math.floor(Math.min(availW, availH*nw/nh)) + 'px'; wr.style.margin = '';
  } else { wr.style.width = ''; wr.style.margin = '10px 0 0'; }
  cssW = wr.clientWidth; cssH = cssW*nh/nw;
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);
  cv.style.height = cssH + 'px';
  draw();
}
const C = p => ({x:p.x*cssW, y:p.y*cssH});

function dot(p,color,r){
  const c = C(p);
  ctx.beginPath(); ctx.arc(c.x,c.y,r+6,0,7); ctx.fillStyle = color; ctx.globalAlpha = .3; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(c.x,c.y,r,0,7); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
}
function label(x,y,text,color){
  ctx.font = 'bold 14px -apple-system,sans-serif';
  const w = ctx.measureText(text).width + 12;
  ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x-w/2,y-12,w,24,6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text,x,y+1);
}

function draw(){
  if(!img) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  ctx.drawImage(img,0,0,cssW,cssH);

  planes.forEach((pl,i) => {
    const col = pl.ok ? COLORS[i%COLORS.length] : '#dc2626', on = i === act;
    const q = pl.quad.map(C);
    // 半透明の四角
    ctx.beginPath(); q.forEach((p,k) => k ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.closePath();
    ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = on ? 3 : 1.5; ctx.strokeStyle = col; if(!pl.ok) ctx.setLineDash([6,5]); ctx.stroke(); ctx.setLineDash([]);
    // 目盛りの線（面に合わせて斜めになる）
    if(pl.ok){
      ctx.lineWidth = 1; ctx.strokeStyle = '#fff'; ctx.globalAlpha = .7;
      [.25,.5,.75].forEach(t => {
        [[t,0,t,1],[0,t,1,t]].forEach(([u1,v1,u2,v2]) => {
          const a = C(fromUnit(pl,u1,v1)), b = C(fromUnit(pl,u2,v2));
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        });
      });
      ctx.globalAlpha = 1;
    }
    // 測定
    pl.items.forEach(it => {
      if(it.length === 2){
        const A = C(it[0]), B = C(it[1]);
        ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y);
        ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.globalAlpha = .45; ctx.stroke(); ctx.globalAlpha = 1;
        ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.stroke();
        if(pl.ok) label((A.x+B.x)/2,(A.y+B.y)/2, fmt(measure(pl,it[0],it[1]).len), col);
      }
      it.forEach(p => dot(p,col,5));
    });
    // 面の名前
    const cx = (q[0].x+q[1].x+q[2].x+q[3].x)/4, cy = (q[0].y+q[1].y+q[2].y+q[3].y)/4;
    if(!live) label(cx,cy,(pl.name || '面'+(i+1))+'  '+pl.w+'×'+pl.h_mm,col);
  });

  // 空間の斜め（3D）
  diags.forEach(d => {
    const col = '#e11d48';
    if(d.pts.length === 2){
      const A = C(d.pts[0]), B = C(d.pts[1]);
      ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y);
      ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.globalAlpha = .45; ctx.stroke(); ctx.globalAlpha = 1;
      ctx.lineWidth = 3; ctx.strokeStyle = col; ctx.setLineDash([9,6]); ctx.stroke(); ctx.setLineDash([]);
      label((A.x+B.x)/2,(A.y+B.y)/2,'3D '+fmt(len3(d)),col);
    }
    d.pts.forEach(p => dot(p,col,6));
  });

  // 角の取っ手（今の面。立方体なら7つの角すべて）
  const cur = planes[act];
  if(cur){
    const col = cur.ok ? COLORS[act%COLORS.length] : '#dc2626';
    const gp = cur.group ? planes.filter(p => p.group === cur.group) : [cur], seen = new Set();
    gp.forEach(pl => pl.quad.forEach((p,k) => {
      if(seen.has(p)) return; seen.add(p);
      dot(p,col,11);
      if(!cur.group){
        const c = C(p);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(k+1,c.x,c.y+.5);
      }
    }));
  }

  if(drag) loupe(drag.p);
  placeEdit();
}

function loupe(p){
  const r = 56, zoom = 3, c = C(p);
  const cx = c.x < cssW/2 ? cssW-r-10 : r+10, cy = r+10;
  const s = (2*r/zoom)*(nw/cssW);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.clip();
  ctx.fillStyle = '#000'; ctx.fillRect(cx-r,cy-r,2*r,2*r);
  ctx.drawImage(img,p.x*nw-s/2,p.y*nh-s/2,s,s,cx-r,cy-r,2*r,2*r);
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = '#ef4444';
  ctx.beginPath(); ctx.moveTo(cx-12,cy); ctx.lineTo(cx+12,cy); ctx.moveTo(cx,cy-12); ctx.lineTo(cx,cy+12); ctx.stroke();
}

/* ---------- 操作（指・マウス・ペン共通） ---------- */
function evPos(e){
  const r = cv.getBoundingClientRect();
  return {x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)), y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))};
}
function hitTest(pos){
  let hit = null, best = R_HIT;
  const consider = (p,pl) => {
    const d = Math.hypot((p.x-pos.x)*cssW,(p.y-pos.y)*cssH);
    if(d < best){ best = d; hit = {p,pl}; }
  };
  const order = [planes[act], ...planes.filter((_,i) => i !== act)];
  order.forEach(pl => { pl.quad.forEach(p => consider(p,pl)); pl.items.forEach(it => it.forEach(p => consider(p,pl))); });
  diags.forEach(d => d.pts.forEach(p => consider(p,null)));
  return hit;
}

cv.addEventListener('pointerdown', e => {
  if(!img) return;
  e.preventDefault(); cv.setPointerCapture(e.pointerId);
  const pos = evPos(e), hit = hitTest(pos), pl = planes[act];
  if(hit){ drag = {p:hit.p, pl:hit.pl}; }
  else if(live){ return; }
  else if(mode === 'diag'){
    if(!pl.group){ setHint('立方体を追加してから使います。',true); return; }
    const gp = planes.filter(p => p.group === pl.group), px = pos.x*cssW, py = pos.y*cssH;
    const inside = f => {
      const q = f.quad.map(C); let s = 0;
      for(let i=0;i<4;i++){
        const a = q[i], b = q[(i+1)%4], cr = (b.x-a.x)*(py-a.y)-(b.y-a.y)*(px-a.x);
        if(Math.abs(cr) < 1e-9) continue;
        if(!s) s = Math.sign(cr); else if(Math.sign(cr) !== s) return false;
      }
      return true;
    };
    const f = gp.find(inside) || pl;   // 立方体の面の中なら、その面。外なら、選んでいる面
    if(!f.ok){ setHint('先に「① 合わせる」で、立方体を正しく合わせてください。',true); return; }
    let last = diags[diags.length-1];
    if(!last || last.g !== pl.group || last.pts.length >= 2){ last = {g:pl.group, pts:[]}; diags.push(last); }
    const pt = {x:pos.x, y:pos.y, f}; last.pts.push(pt); drag = {p:pt, pl:f};
  }
  else if(mode === 'mea'){
    if(!pl.ok){ setHint('先に「① 合わせる」で、四角を正しく合わせてください。',true); return; }
    let last = pl.items[pl.items.length-1];
    if(!last || last.length >= 2){ last = []; pl.items.push(last); }
    last.push(pos); drag = {p:pos, pl};
  } else return;
  update();
});
cv.addEventListener('pointermove', e => {
  if(!drag) return;
  e.preventDefault();
  const pos = evPos(e); drag.p.x = pos.x; drag.p.y = pos.y;
  planes.forEach(recalc); update();
});
const endDrag = () => { if(drag){ drag = null; update(); } };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

/* ---------- 画面の更新 ---------- */
function setHint(t,warn){ const h = $('hint'); h.textContent = t; h.style.color = warn ? '#dc2626' : ''; }

function renderTabs(){
  const t = $('tabs'); t.innerHTML = '';
  planes.forEach((pl,i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === act ? ' on' : '');
    b.style.borderLeftColor = COLORS[i%COLORS.length];
    b.textContent = pl.name || '面' + (i+1);
    b.onclick = () => { act = i; syncInputs(); renderTabs(); update(); };
    t.appendChild(b);
  });
  const add = document.createElement('button'); add.textContent = '＋面を追加';
  add.onclick = () => { if(planes.length >= 8) return; planes.push(newPlane(planes.length)); act = planes.length-1; syncInputs(); setMode('quad'); renderTabs(); };
  const cube = document.createElement('button'); cube.textContent = '＋立方体（サイコロ）';
  cube.onclick = () => { if(planes.length > 5) return; const c = newCube(); act = planes.length; planes.push(...c); syncInputs(); setMode('quad'); renderTabs(); };
  const g = planes[act] && planes[act].group;
  const rest = planes.filter(p => g ? p.group !== g : p !== planes[act]);
  const del = document.createElement('button'); del.textContent = g ? 'この立方体を消す' : 'この面を消す'; del.disabled = rest.length < 1;
  del.onclick = () => { if(g) diags = diags.filter(d => d.g !== g); planes = rest; act = Math.max(0,Math.min(act,planes.length-1)); syncInputs(); renderTabs(); update(); };
  t.append(add,cube,del);
}
function syncInputs(){
  const pl = planes[act]; if(!pl) return;
  [['sw',pl.w],['ew',pl.w],['sh',pl.h_mm],['eh',pl.h_mm]].forEach(([id,v]) => {
    const el = $(id); if(document.activeElement !== el) el.value = v;
  });
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', +b.dataset.s === pl.w && pl.w === pl.h_mm));
  $('sizeRow1').style.display = $('sizeRow2').style.display = pl.group ? 'none' : '';
  syncLive();
}
function update(){
  const pl0 = planes[act];
  if(mode === 'diag' && !(pl0 && pl0.group)){
    mode = 'quad'; $('bQuad').classList.add('on'); $('bMea').classList.remove('on'); $('bDiag').classList.remove('on');
  }
  $('bDiag').style.display = pl0 && pl0.group ? '' : 'none';
  draw();
  const pl = planes[act];
  if(pl){
    if(!pl.ok) setHint('四角の形がおかしい（ねじれている）です。①②③④の順に、実物の角に合わせてください。',true);
    else if(live) setHint('カメラ中です。四角（または立方体）の角を、実物の角に合わせます。合ったら、下の「● 撮影」を押します。');
    else if(mode === 'quad') setHint(pl.group
      ? '立方体の7つの角をドラッグして、実物の箱の角に合わせます。上・左・右の3面が、それぞれ測れる面になります。立方体の1辺は1000mm（1m）で固定です。'
      : '半透明の四角の角（①②③④）をドラッグして、実物の四角の角に合わせます。線の上の数字（mm）をタップすると、長さを打ち直せます。合ったら「② 測る」へ。');
    else if(mode === 'diag') setHint('空間の斜めを測ります。2か所をタップしてください。立方体の面の中をタップするとその面の点になります。立方体の外（壁など）は、上のタブで選んだ面の上の点になります。');
    else setHint('測りたい場所の両端を2か所タップします。点はドラッグで動かせます。');
  }
  // 結果の一覧
  let html = '', any = false;
  planes.forEach((p,i) => {
    const done = p.items.filter(it => it.length === 2);
    if(!done.length) return; any = true;
    html += `<div class="pname"><span class="sw" style="background:${COLORS[i%COLORS.length]}"></span>${p.name || '面'+(i+1)}（基準 ${p.w}×${p.h_mm} mm）</div><ul>`;
    done.forEach((it,k) => {
      const m = measure(p,it[0],it[1]);
      html += `<li><span>${k+1}</span><span><span class="big">${fmt(m.len)}</span> <small>横 ${fmt(m.dx)} / 縦 ${fmt(m.dy)}</small></span></li>`;
    });
    html += '</ul>';
  });
  const dd = diags.filter(d => d.pts.length === 2);
  if(dd.length){
    any = true; html += '<div class="pname"><span class="sw" style="background:#e11d48"></span>斜め（3D）</div><ul>';
    dd.forEach((d,k) => { html += `<li><span>${k+1}</span><span><span class="big">${fmt(len3(d))}</span> <small>${d.pts[0].f.name} → ${d.pts[1].f.name}</small></span></li>`; });
    html += '</ul>';
  }
  $('list').innerHTML = html; $('listCard').style.display = any ? '' : 'none';
}
function setMode(m){
  mode = m;
  $('bQuad').classList.toggle('on', m === 'quad');
  $('bMea').classList.toggle('on', m === 'mea');
  $('bDiag').classList.toggle('on', m === 'diag');
  update();
}
$('bQuad').onclick = () => setMode('quad');
$('bMea').onclick = () => setMode('mea');
$('bDiag').onclick = () => setMode('diag');

document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  setSize(planes[act],+b.dataset.s,+b.dataset.s); syncInputs(); update();
});
['sw','ew'].forEach(id => $(id).addEventListener('input', e => { const v = parseFloat(e.target.value); if(v > 0){ setSize(planes[act],v,null); syncInputs(); update(); } }));
['sh','eh'].forEach(id => $(id).addEventListener('input', e => { const v = parseFloat(e.target.value); if(v > 0){ setSize(planes[act],null,v); syncInputs(); update(); } }));
function placeEdit(){
  const pl = planes[act]; if(!pl) return;
  $('ew').style.display = $('eh').style.display = (live || pl.group) ? 'none' : '';
  if(live || pl.group) return;
  const a = C(pl.quad[0]), b = C(pl.quad[1]), d = C(pl.quad[3]);
  const put = (el,x,y) => { el.style.left = Math.min(cssW-48,Math.max(48,x)) + 'px'; el.style.top = Math.min(cssH-18,Math.max(18,y)) + 'px'; };
  put($('ew'),(a.x+b.x)/2,(a.y+b.y)/2); put($('eh'),(a.x+d.x)/2,(a.y+d.y)/2);
}
$('alpha').addEventListener('input', e => { alpha = e.target.value/100; $('alphaV').textContent = e.target.value + '%'; draw(); });

$('bUndo').onclick = () => {
  const pl = planes[act];
  if(mode === 'diag'){
    const last = diags[diags.length-1];
    if(last){ last.pts.pop(); if(!last.pts.length) diags.pop(); }
  } else {
    const last = pl.items[pl.items.length-1];
    if(last){ last.pop(); if(!last.length) pl.items.pop(); }
  }
  update();
};
$('bClear').onclick = () => {
  if(mode === 'diag'){ const g = planes[act].group; diags = diags.filter(d => d.g !== g); }
  else planes[act].items = [];
  update();
};

/* ---------- カメラ（撮影しながら、四角・立方体を重ねる） ---------- */
async function startCam(){
  const msg = $('camMsg'); msg.textContent = '';
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nocam');
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:3840},height:{ideal:2160}},audio:false});
  }catch(err){
    msg.textContent = 'このページでは、カメラを開けません。自分のページに置いて、https のアドレスで開くと使えます。今は「写真を撮る／選ぶ」を使ってください。';
    return;
  }
  vid = document.createElement('video'); vid.setAttribute('playsinline',''); vid.muted = true; vid.srcObject = stream;
  await vid.play();
  if(!vid.videoWidth) await new Promise(r => vid.addEventListener('loadedmetadata', r, {once:true}));
  nw = vid.videoWidth; nh = vid.videoHeight; img = vid; live = true;
  const S0 = planes[act] ? planes[act].w : 1000;
  planes = [newPlane(0)]; act = 0; diags = []; setSize(planes[0],S0,S0);
  document.body.classList.add('live'); $('wrap').classList.add('live');
  $('work').style.display = ''; $('liveBar').style.display = 'flex';
  renderTabs(); syncInputs(); setMode('quad'); layout();
  (function tick(){ if(!live) return; draw(); requestAnimationFrame(tick); })();
}
function stopCam(){
  live = false;
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('liveBar').style.display = 'none';
  document.body.classList.remove('live'); $('wrap').classList.remove('live'); $('wrap').style.width = '';
}
function syncLive(){
  const pl = planes[act]; if(!pl) return;
  $('lSq').classList.toggle('on', !pl.group); $('lCube').classList.toggle('on', !!pl.group);
  if(document.activeElement !== $('lsz')) $('lsz').value = pl.w;
  $('lszBox').style.display = pl.group ? 'none' : '';
}
$('lSq').onclick = () => { const S = planes[act].group ? 1000 : planes[act].w; planes = [newPlane(0)]; act = 0; setSize(planes[0],S,S); diags = []; syncInputs(); renderTabs(); update(); };
$('lCube').onclick = () => { const c = newCube(); planes = c; act = 0; diags = []; syncInputs(); renderTabs(); update(); };
$('lsz').addEventListener('input', e => { const v = parseFloat(e.target.value); if(v > 0){ setSize(planes[act],v,v); syncInputs(); update(); } });
$('lalpha').addEventListener('input', e => {
  alpha = e.target.value/100; $('lalphaV').textContent = e.target.value + '%';
  $('alpha').value = e.target.value; $('alphaV').textContent = e.target.value + '%'; draw();
});
document.querySelectorAll('#work > .row, #hint').forEach(e => e.classList.add('wk'));
{ const nt = document.querySelector('body > p.small'); if(nt) nt.classList.add('note'); }
function shoot(){
  const c = document.createElement('canvas'); c.width = nw; c.height = nh;
  c.getContext('2d').drawImage(vid,0,0,nw,nh);
  c.toBlob(b => {
    const im = new Image();
    im.onload = () => { stopCam(); img = im; layout(); update(); };
    im.src = URL.createObjectURL(b);
  }, 'image/jpeg', .95);
}
$('bCam').onclick = startCam;
$('bShoot').onclick = shoot;
$('bStop').onclick = () => { stopCam(); img = null; $('work').style.display = 'none'; };

/* ---------- 写真の読み込み・保存 ---------- */
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const im = new Image();
  im.onload = () => {
    stopCam(); img = im; nw = im.naturalWidth; nh = im.naturalHeight;
    planes = [newPlane(0)]; act = 0; diags = [];
    $('work').style.display = '';
    renderTabs(); syncInputs(); setMode('quad'); layout();
  };
  im.src = URL.createObjectURL(f);
  e.target.value = '';
});
window.addEventListener('resize', layout);

</script>
